name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest   # GitHub-hosted: this repo is public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: docker build -t mail-triage:ci .
