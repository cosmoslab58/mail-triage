# Copy to compose.yaml next to your config.yaml + profile.md, then: docker compose up -d
services:
  mail-triage:
    image: ghcr.io/cosmoslab58/mail-triage:latest   # or pin a release, e.g. :0.1
    # build: .                                      # ...or build from this checkout instead
    container_name: mail-triage
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./profile.md:/config/profile.md:ro   # re-read on every message, edits apply live
      - mail-triage-data:/data               # state: cursors, contacts, learned corrections
volumes:
  mail-triage-data:
